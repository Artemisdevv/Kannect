name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only reads the repo. One deploy at a time.
permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # Pinned to a commit (v4.3.1): a moved tag cannot change what runs here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Calls Render's API directly instead of a third-party action, so the API key is only ever
      # given to Render, and the secrets reach the script as environment variables.
      - name: Deploy to Render and wait until it is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          auth="Authorization: Bearer ${RENDER_API_KEY}"

          deploy_id=$(curl -fsS -X POST "$api" -H "$auth" -H "Accept: application/json" \
            -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}' | jq -r '.id')
          [ -n "$deploy_id" ] && [ "$deploy_id" != "null" ] || { echo "Render did not return a deploy id"; exit 1; }
          echo "Deploy started: $deploy_id"

          for _ in $(seq 1 100); do   # up to about 17 minutes
            status=$(curl -fsS "$api/$deploy_id" -H "$auth" -H "Accept: application/json" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              live) echo "Deploy is live"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy ended with status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the deploy"; exit 1

      - name: Verify deployment
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          sleep 10
          curl -fsS "https://${RENDER_SERVICE_URL}/api/v1/health"
          curl -fsS "https://${RENDER_SERVICE_URL}/api/v1/health/db"
