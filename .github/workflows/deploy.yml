name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-community/action-render-deploy@v1
        with:
          renderApiKey: ${{ secrets.RENDER_API_KEY }}
          serviceIds: ${{ secrets.RENDER_SERVICE_ID }}
          waitForDeployment: true
          timeout: 600

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://${{ secrets.RENDER_SERVICE_URL }}/api/v1/health || exit 1
          curl -f https://${{ secrets.RENDER_SERVICE_URL }}/api/v1/health/db || exit 1
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}