services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kadanet
      POSTGRES_PASSWORD: kadanet
      POSTGRES_DB: kadanet
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadanet"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://kadanet:kadanet@db:5432/kadanet
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/srv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  dbdata:
